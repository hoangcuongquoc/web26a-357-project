<div class="ai-chat-widget">
  @if (open()) {
    <div class="panel" role="dialog" aria-label="Trợ lý AI">
      <header class="panel-header">
        <h2>Trợ lý AI</h2>
        <button type="button" class="icon-btn" aria-label="Đóng" (click)="toggle()">×</button>
      </header>

      <div class="messages">
        @if (messages().length === 0) {
          <p class="hint-text">
            Gõ câu tự nhiên, ví dụ: "Họp với Hùng thứ 6 tuần sau lúc 3 giờ chiều".
          </p>
        }
        @for (m of messages(); track m.id) {
          <div class="message" [class]="'role-' + m.role">
            <p>{{ m.text }}</p>
            @if (m.suggestManualForm) {
              <button
                type="button"
                class="text-btn"
                (click)="openManualForm.emit(m.guessedTitle ?? '')"
              >
                Mở form nhập tay
              </button>
            }
          </div>
        }
      </div>

      @if (error()) {
        <p class="field-error">{{ error() }}</p>
      }

      <div class="input-row">
        <input
          class="text-input"
          type="text"
          [ngModel]="draft()"
          (ngModelChange)="draft.set($event)"
          placeholder="Nhập yêu cầu…"
          [disabled]="sending()"
          (keydown.enter)="$event.preventDefault(); send()"
        />
        <button type="button" class="primary-btn" [disabled]="sending()" (click)="send()">
          Gửi
        </button>
      </div>
    </div>
  }

  <button type="button" class="fab" aria-label="Trợ lý AI" (click)="toggle()">✨</button>
</div>
