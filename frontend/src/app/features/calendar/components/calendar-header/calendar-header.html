<header class="topbar">
  <div class="left">
    <button
      type="button"
      class="icon-btn"
      aria-label="Ẩn/hiện thanh bên"
      (click)="store.toggleSidebar()"
    >
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          fill="currentColor"
          d="M3 18h18v-2H3zm0-5h18v-2H3zm0-7v2h18V6z"
        />
      </svg>
    </button>
    <span class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <rect x="2" y="3" width="15" height="15" rx="4" fill="#1a73e8" />
        <text x="8" y="12" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">
          {{ store.today().getDate() }}
        </text>
        <rect
          x="12.5"
          y="12.5"
          width="9.5"
          height="9.5"
          rx="2.5"
          fill="#f5a623"
          style="stroke: var(--color-surface); stroke-width: 1.4px"
        />
      </svg>
      <span class="brand-name">Timebox</span>
    </span>
  </div>

  <div class="center">
    <button type="button" class="today-btn" (click)="store.goToday()">Hôm nay</button>
    <button type="button" class="icon-btn" aria-label="Trước" (click)="store.step(-1)">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </button>
    <button type="button" class="icon-btn" aria-label="Sau" (click)="store.step(1)">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z" />
      </svg>
    </button>
    <h1 class="period-label">{{ periodLabel() }}</h1>
  </div>

  <div class="right">
    <div class="view-switch" role="tablist">
      @for (v of viewModes; track v.mode) {
        <button
          type="button"
          role="tab"
          class="view-btn"
          [class.active]="store.viewMode() === v.mode"
          [attr.aria-selected]="store.viewMode() === v.mode"
          (click)="setViewMode(v.mode)"
        >
          {{ v.label }}
        </button>
      }
    </div>

    <app-theme-toggle />

    @if (userEmail()) {
      <span class="user-email">{{ userEmail() }}</span>
    }
    <button type="button" class="today-btn" (click)="logout()">Đăng xuất</button>
  </div>
</header>
