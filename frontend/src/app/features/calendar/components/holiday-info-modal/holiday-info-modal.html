<div class="backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true">
  <div class="card">
    <button type="button" class="close-btn" (click)="close()" aria-label="Đóng">✕</button>

    <div class="icon">🎉</div>
    <span class="badge">Ngày lễ · Chỉ xem</span>
    <h2 class="title">{{ event().title }}</h2>
    <p class="date">{{ displayDate() }}</p>
  </div>
</div>
