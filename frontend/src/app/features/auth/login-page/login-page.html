<div class="auth-page">
  <app-theme-toggle class="theme-toggle-corner" />
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-title">Đăng nhập</h1>

    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() }}</p>
    }

    <label class="field">
      <span class="field-label">Email</span>
      <input class="text-input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">Vui lòng nhập email hợp lệ.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Mật khẩu</span>
      <input
        class="text-input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Vui lòng nhập mật khẩu.</span>
      }
    </label>

    <button type="submit" class="primary-btn" [disabled]="submitting()">
      {{ submitting() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
    </button>

    <p class="auth-footer">
      Chưa có tài khoản? <a routerLink="/register">Đăng ký</a>
    </p>
  </form>
</div>
