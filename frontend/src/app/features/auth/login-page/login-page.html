<div class="auth-page">
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>
  <canvas class="particle-canvas" #particleCanvas aria-hidden="true"></canvas>

  <div class="form-panel">
    <a class="back-to-landing" routerLink="/landing" aria-label="Quay lại trang giới thiệu">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5" />
        <path d="M12 19 5 12l7-7" />
      </svg>
      Quay lại
    </a>

    <form
      class="auth-card"
      [formGroup]="form"
      (ngSubmit)="submit()"
      (mousemove)="onCardMouseMove($event)"
      (mouseleave)="onCardMouseLeave($event)"
    >
      <div class="auth-header">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="17" rx="4" stroke="#fff" stroke-width="1.8" />
            <path d="M3 9h18" stroke="#fff" stroke-width="1.8" />
            <path d="M8 2v4M16 2v4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </div>
        <h1 class="auth-title">Đăng nhập</h1>
        <p class="auth-subtitle">Nhập Email của bạn để truy cập ngay lập tức</p>
      </div>

      @if (successMessage()) {
        <div class="alert-box success">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>{{ successMessage() }}</span>
        </div>
      }
      @if (errorMessage()) {
        <div class="alert-box danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <label class="field">
        <span class="field-label">Địa chỉ Email / Gmail</span>
        <div class="input-with-icon">
          <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
          <input class="text-input" type="email" formControlName="email" placeholder="tenbancan@gmail.com" autocomplete="email" />
        </div>
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="field-error">Vui lòng nhập địa chỉ email hợp lệ.</span>
        }
      </label>

      <button type="submit" class="primary-btn" [disabled]="submitting()">
        {{ submitting() ? 'Đang truy cập…' : 'Tiếp tục bằng Email' }}
      </button>

      <div class="auth-divider"><span>hoặc</span></div>

      <button type="button" class="google-btn" (click)="signInWithGoogle()">
        <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"
          />
          <path
            fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18Z"
          />
          <path
            fill="#FBBC05"
            d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33Z"
          />
          <path
            fill="#EA4335"
            d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58Z"
          />
        </svg>
        Đăng nhập với Google
      </button>

      <div class="auth-hint">
        <span>✨ Sau khi bấm tiếp tục, hệ thống sẽ hiện bảng để bạn chọn <strong>Tên hiển thị mong muốn</strong> khi vào Lịch.</span>
      </div>
    </form>
  </div>
</div>
